name: Update GitHub profile charts
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/update-profile-charts.yml
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: write
concurrency:
  group: profile-charts
  cancel-in-progress: false
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate charts from GitHub GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: samaelsimoes
        run: |
          python scripts/generate_stats.py
          python scripts/generate_profile_charts.py
      - name: Commit generated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile charts"
            git push
          fi
