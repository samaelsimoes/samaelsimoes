name: Update GitHub profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '24 6 * * *'

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate contribution SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: samaelsimoes
        run: python scripts/generate_stats.py
      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-dashboard.svg assets/monthly-commits.svg assets/yearly-commits.svg assets/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub contribution dashboard"
            git push
          fi
